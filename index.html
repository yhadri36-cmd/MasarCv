<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسار CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>مسار CV</h1>
    </div>
    <div class="toolbar">
      <button class="btn btn-light" type="button" onclick="loadSampleData()">عرض السيرة التجريبية</button>
      <button class="btn btn-light" type="button" onclick="startBlankWriting()">كتابة ببيانات فارغة</button>
      <button class="btn btn-danger" type="button" onclick="clearForm()">مسح الكل</button>
      <button id="downloadPdfBtn" class="btn btn-primary" type="button" onclick="downloadPDF()">تحميل / طباعة PDF</button>
    </div>
  </header>

  <div class="page-shell">
    <nav class="top-sections-bar" aria-label="اختيار القسم">
      <div class="top-nav-grid">
        <button id="navSec-design" class="top-nav-btn active" type="button" onclick="selectWorkspaceSection('design')">تصميم السيرة الذاتية</button>
        <button id="navSec-audit" class="top-nav-btn" type="button" onclick="selectWorkspaceSection('audit')">اختبار / فحص السيرة (ATS)</button>
        <button id="navSec-dispatch" class="top-nav-btn" type="button" onclick="selectWorkspaceSection('dispatch')">الإرسال للجهات</button>
        <button id="navSec-video" class="top-nav-btn" type="button" onclick="selectWorkspaceSection('video')">شرح الموقع</button>
      </div>
    </nav>

    <section id="video-guide-section" class="video-guide-box hidden-block"></section>
    <main id="section-design" class="container"></main>
    <section id="section-audit" class="panel hidden-block"></section>
    <section id="section-dispatch" class="panel hidden-block"></section>
  </div>

  <div id="assistantRoot" class="assistant-fab-wrap"></div>

  <script src="js/store.js"></script>
  <script src="js/section-video.js"></script>
  <script src="js/section-design.js"></script>
  <script src="js/section-audit.js"></script>
  <script src="js/section-dispatch.js"></script>
  <script src="js/assistant.js"></script>
</body>
</html>
